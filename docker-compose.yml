services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unsw_dw
      POSTGRES_USER: unsw
      POSTGRES_PASSWORD: unsw_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - unsw-postgres-data:/var/lib/postgresql/data
      - ./sql/01_staging_tables.sql:/docker-entrypoint-initdb.d/01_staging_tables.sql:ro
      - ./sql/02_star_schema_ddl.sql:/docker-entrypoint-initdb.d/02_star_schema_ddl.sql:ro
      - ./sql/05_analytical_views.sql:/docker-entrypoint-initdb.d/05_analytical_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unsw -d unsw_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://unsw:unsw_password@postgres:5432/unsw_dw
      FRONTEND_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    environment:
      DATABASE_URL: postgresql://unsw:unsw_password@postgres:5432/unsw_dw
    volumes:
      - ./data/raw:/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  unsw-postgres-data:
